[project]
name = "cvd"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Harrison Webster", email = "xharrywebster@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "dvc>=3.67.1",
    "h5py>=3.16.0",
    "jinja2>=3.1.6",
    "pint>=0.25.3",
    "pydantic>=2.13.4",
    "pyvista>=0.48.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
cvd = "cvd.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"
