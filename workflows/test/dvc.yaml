stages:
  # Stage 1: Configure & Run OpenFOAM Fluid Mechanics
  run_fluid_cfd:
    cmd: >
      cvd openfoam configure --params params.yaml --output-dir openfoam_case &&
      cvd openfoam run --case openfoam_case --params params.yaml
    deps:
      - params.yaml
      - ../_shared/openfoam/
    outs:
      # The whole directory, not individual sub-paths: a real parallel run
      # produces processorN/ for however many n_procs, plus
      # adaptive-timestep-named reconstructed time directories, case.foam,
      # and the rendered case skeleton -- none of which can be robustly
      # enumerated ahead of time. Downstream stages can still depend on a
      # specific file within it (e.g. terminal_fluid_state.json).
      - openfoam_case/

  # Stage 2: Ingest Fluid Profile, Configure & Run WarpX Plasma Physics
  run_plasma_pic:
    cmd: >
      cvd warpx configure --params params.yaml --fluid-state openfoam_case/terminal_fluid_state.json --output-dir warpx_case &&
      cvd warpx run --case warpx_case --params params.yaml
    deps:
      - params.yaml
      - ../_shared/warpx/
      - openfoam_case/terminal_fluid_state.json
    outs:
      # Whole directory, same reasoning as run_fluid_cfd above: the number
      # and names of diags/openpmd/*.h5 iteration files depend on n_steps
      # and diag_intervals, which can't be enumerated ahead of time.
      - warpx_case/

  # Stage 3: Ingest Plasma Fluence, Configure & Run Xolotl Surface Deposition
  run_surface_growth:
    cmd: >
      cvd xolotl configure --params params.yaml --flux-file warpx_case/surface_bombardment_flux.h5 --output-dir xolotl_case &&
      cvd xolotl run --case xolotl_case --mock
    deps:
      - params.yaml
      - ../_shared/xolotl/
      - warpx_case/surface_bombardment_flux.h5
    outs:
      - xolotl_case/crystal_growth_metrics.csv
